name: Gold Next CI

on:
  push:
    branches: [ gold-next, port/telegram-13.2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select project Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 - <<'PY'
          import json
          with open("versions.json", "r", encoding="utf-8") as f:
              print(json.load(f)["xcode"])
          PY
          )"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test refresh task lifecycle
        shell: bash
        run: python3 build-system/gold-next/test_refresh_task_lifecycle.py --require-swift

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      # #107: reuse immutable compiler actions across ephemeral macOS runners.
      # Do not archive the full output_user_root, app IPA, or signing data.
      - name: Restore bounded Bazel disk cache
        id: bazel_restore
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/goldgram-bazel-action-cache
          key: gold-next-bazel-xcode27-${{ hashFiles('versions.json', '.bazelrc', 'MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            gold-next-bazel-xcode27-${{ hashFiles('versions.json', '.bazelrc', 'MODULE.bazel.lock') }}-
      - name: Identify Mx toolchain
        id: mx_toolchain
        shell: bash
        run: |
          fingerprint="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-build-version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Runner: $(sysctl -n hw.logicalcpu) logical CPUs, $(sysctl -n hw.memsize) bytes RAM"
          df -h "$RUNNER_TEMP"

      - name: Restore compiled Mx
        id: mx_cache
        uses: actions/cache/restore@v4
        with:
          path: mx-output
          key: mx-arm64-v1-${{ steps.mx_toolchain.outputs.fingerprint }}-${{ hashFiles('.github/workflows/build.yml', 'versions.json', 'build-system/gold-next/prepare_mx.py', 'build-system/gold-next/*.swift', 'build-system/gold-next/*.m', 'submodules/TelegramApi/swift_scheme.tl') }}

      - name: Validate cached Mx
        id: mx
        shell: bash
        run: |
          if [[ -s mx-output/Mx.dylib && -s mx-output/Mx.bundle/langs.json && -s mx-output/Mx.bundle/ru.lproj/Localizable.strings ]] &&
             (cd mx-output && shasum -a 256 -c SHA256SUMS >/dev/null && lipo -verify_arch arm64 Mx.dylib); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned Mx 1.0.0 source
        if: steps.mx.outputs.ready != 'true'
        uses: actions/checkout@v4
        with:
          repository: m1ronx1412/mxgram
          ref: 23c980300c3e9c98f39ee2bd073fe83d317e15ba
          path: mxgram

      # Pin the exact Theos/SDK revisions previously used by the action.
      # Its cached update-theos path resets origin/master, but this fork uses main.
      - name: Install Theos dependencies for Mx
        if: steps.mx.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Fetch pinned Theos for Mx
        if: steps.mx.outputs.ready != 'true'
        uses: actions/checkout@v4
        with:
          repository: waruhachi/theos
          ref: 9e7d18adf3b1bc0b8ab432e08900ff71c560d7a8
          submodules: recursive
          path: theos

      - name: Fetch pinned Theos SDKs for Mx
        if: steps.mx.outputs.ready != 'true'
        uses: actions/checkout@v4
        with:
          repository: waruhachi/sdks
          ref: a7b81140aa8ce18b6e6a48846d4e63476b1e5709
          path: theos/sdks

      - name: Validate Goldgram SQLite v1 to v2 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/gold-next/test_sqlite_schema.py
          python3 build-system/gold-next/test_sqlite_edits.py
          python3 build-system/gold-next/test_sqlite_reader.py
          python3 build-system/gold-next/test_sqlite_browser.py
          python3 build-system/gold-next/test_sqlite_public_capture.py
          python3 build-system/gold-next/test_sqlite_public_edits.py
          python3 build-system/gold-next/test_sqlite_native_jump.py
          python3 build-system/gold-next/test_sqlite_clear_history.py
          python3 build-system/gold-next/test_sqlite_channel_folders.py
          swiftc build-system/gold-next/GoldgramArchiveGrouping.swift build-system/gold-next/test_archive_grouping.swift -o "$RUNNER_TEMP/goldgram-grouping-test"
          "$RUNNER_TEMP/goldgram-grouping-test"
          python3 build-system/gold-next/test_native_history_queries.py
          python3 build-system/gold-next/test_native_writer_sql.py
          python3 build-system/gold-next/test_native_write_boundary.py
          python3 build-system/gold-next/test_discussion_priority_policy.py
          python3 build-system/gold-next/test_difference_original_capture.py
          python3 build-system/gold-next/test_deletion_reconciliation.py
          python3 build-system/gold-next/test_background_refresh_ci.py
          python3 build-system/gold-next/test_background_run_diagnostics.py
          python3 build-system/gold-next/test_background_session_stages.py
          python3 build-system/gold-next/run_background_residency.py
          python3 build-system/gold-next/run_fast_resume.py
          python3 build-system/gold-next/run_background_completion.py
          python3 build-system/gold-next/run_window_drain.py
          python3 build-system/gold-next/test_collect_dsyms.py
          python3 build-system/gold-next/run_retention_guard.py
          python3 build-system/gold-next/run_notification_handoff.py
          swiftc build-system/gold-next/GoldgramHistoryStore.swift build-system/gold-next/test_native_capture.swift -o "$RUNNER_TEMP/goldgram-native-capture-test"
          "$RUNNER_TEMP/goldgram-native-capture-test"
          python3 build-system/gold-next/run_postbox_snapshot_codec.py
          swiftc submodules/TelegramCore/Sources/State/GoldgramEventPolicy.swift build-system/gold-next/test_native_event_policy.swift -o "$RUNNER_TEMP/goldgram-event-policy-test"
          "$RUNNER_TEMP/goldgram-event-policy-test"
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios15.0 build-system/gold-next/GoldgramHistoryStore.swift

      - name: Build Mx 1.0.0 for Swiftgram 13.2
        if: steps.mx.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          python3 build-system/gold-next/prepare_mx.py mxgram
          cd mxgram
          make clean
          make -j"$(sysctl -n hw.logicalcpu)" package FINALPACKAGE=1 STRIP=0 ARCHS=arm64 \
            'Sources/tgapi/VideoToVoice.xm_CFLAGS=-std=c++17'
          test -f packages/Mx.dylib
          test -f Mx.bundle/langs.json
          rm -rf ../mx-output
          mkdir ../mx-output
          cp packages/Mx.dylib ../mx-output/
          cp -R Mx.bundle ../mx-output/
          cd ../mx-output
          find Mx.dylib Mx.bundle -type f -exec shasum -a 256 {} + > SHA256SUMS
          echo "Mx build (s): $SECONDS" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Cyan injector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .mx-venv
          .mx-venv/bin/python -m pip install --upgrade pip
          .mx-venv/bin/python -m pip install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/740d3716dcd98c20c000f12cdb88f1f0b2a533a4.zip
          echo "$GITHUB_WORKSPACE/.mx-venv/bin" >> "$GITHUB_PATH"
          .mx-venv/bin/cyan --help >/dev/null

      - name: Build clean Swiftgram
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT=/private/var/tmp/_bazel_containerhost
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION="$(python3 - <<'PY'
          import json
          with open("versions.json", "r", encoding="utf-8") as f:
              print(json.load(f)["app"])
          PY
          )"
          export COMMIT_COUNT="$(git rev-list --count HEAD)"
          export BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

          # This CI produces an unsigned IPA that will be re-signed later.
          # Telegram's bundled fake profiles can be expired; exempt only those
          # exact fixture UUIDs while keeping normal profile validation intact.
          python3 -u <<'PY'
          import pathlib
          import plistlib
          import subprocess

          profile_dir = pathlib.Path("build-system/fake-codesigning/profiles")
          fixture_ids = []
          for path in sorted(profile_dir.glob("*.mobileprovision")):
              profile = plistlib.loads(subprocess.check_output(
                  ["security", "cms", "-D", "-i", str(path)]
              ))
              fixture_ids.append(profile["UUID"])
              print("CI fixture:", path.name, "expires:", profile["ExpirationDate"])

          if not fixture_ids:
              raise SystemExit("No bundled fake provisioning profiles found")

          tool = pathlib.Path(
              "build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py"
          )
          source = tool.read_text()
          marker = "is_ci_fixture = self._profile_metadata.get('UUID') in "
          original = "    if expire and expire < datetime.datetime.now():"

          if marker not in source:
              if source.count(original) != 1:
                  raise SystemExit(
                      "Unexpected plisttool expiry check; refusing an unsafe CI patch"
                  )
              replacement = (
                  "    is_ci_fixture = self._profile_metadata.get('UUID') in "
                  + repr(tuple(fixture_ids))
                  + "\n"
                  + "    if expire and expire < datetime.datetime.now() and is_ci_fixture:\n"
                  + "      print('WARNING: expired CI fixture; output requires re-signing')\n"
                  + "    if expire and expire < datetime.datetime.now() and not is_ci_fixture:"
              )
              tool.write_text(source.replace(original, replacement))

          with pathlib.Path(".bazelrc").open("a") as config:
              config.write(
                  "\n# Gold Next CI unsigned archive for re-signing\n"
                  "build --features=disable_legacy_signing\n"
                  "build --experimental_disk_cache_gc_max_size=10G --experimental_disk_cache_gc_idle_delay=1s\n"
              )
          PY

          mkdir -p "/private/var/tmp/goldgram-bazel-action-cache"
          python3 -u build-system/Make/Make.py             --bazelUserRoot="$BAZEL_USER_ROOT"             --cacheDir="/private/var/tmp/goldgram-bazel-action-cache"             build             --configurationPath="build-system/appstore-configuration.json"             --codesigningInformationPath=build-system/fake-codesigning             --configuration=release_arm64             --buildNumber="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/goldgram-bazel.log"

          OUTPUT_PATH=build/artifacts
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA="bazel-bin/Telegram/Swiftgram.ipa"
          test -f "$IPA"
          cp "$IPA" "$OUTPUT_PATH/Swiftgram.ipa"
          ls -lh "$OUTPUT_PATH/Swiftgram.ipa"

      - name: Measure Bazel cache after native GC
        id: bazel_size
        shell: bash
        run: |
          cache=/private/var/tmp/goldgram-bazel-action-cache
          cap_kib=$((10 * 1024 * 1024))
          initial=unavailable
          size=unavailable
          echo "save=false" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            # Native idle GC can unlink an entry while du walks the cache.
            # A failed walk is incomplete and must never authorize a cache save.
            if measurement=$(du -sk "$cache" 2>"$RUNNER_TEMP/goldgram-cache-size.err"); then
              size=${measurement%%[[:space:]]*}
              if [[ "$size" =~ ^[0-9]+$ ]]; then
                [[ "$initial" != unavailable ]] || initial=$size
                if (( size <= cap_kib )); then
                  echo "save=true" >> "$GITHUB_OUTPUT"
                  break
                fi
              fi
            fi
            if (( attempt < 5 )); then sleep 2; fi
          done
          if ! grep -q '^save=true$' "$GITHUB_OUTPUT"; then
            echo "::warning::Bazel cache could not be measured within 10 GiB; skipping cache save."
            cat "$RUNNER_TEMP/goldgram-cache-size.err" >&2
          fi
          {
            echo "Mx cache validated: ${{ steps.mx.outputs.ready }}"
            echo "Bazel cache before/after idle GC (KiB): $initial / $size"
            grep -E 'INFO: (Elapsed time:|[0-9]+ processes:)' "$RUNNER_TEMP/goldgram-bazel.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save bounded Bazel disk cache
        continue-on-error: true
        if: steps.bazel_size.outputs.save == 'true' && steps.bazel_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/goldgram-bazel-action-cache
          key: gold-next-bazel-xcode27-${{ hashFiles('versions.json', '.bazelrc', 'MODULE.bazel.lock') }}-${{ github.sha }}
      - name: Inject Mx into the host only
        shell: bash
        run: |
          set -euo pipefail
          IPA=/Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          cyan -i "$IPA" -o "$RUNNER_TEMP/Swiftgram-mx.ipa" \
            -s -f mx-output/Mx.dylib mx-output/Mx.bundle
          test -s "$RUNNER_TEMP/Swiftgram-mx.ipa"

      - name: Install ipapatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api repos/asdfzxcvbn/ipapatch/releases/latest --jq .tag_name)"
          ARCH="$(uname -m)"
          if [[ "$ARCH" == "arm64" ]]; then
            ASSET="ipapatch.macos-arm64"
          else
            ASSET="ipapatch.macos-amd64"
          fi
          gh release download "$TAG" \
            --repo asdfzxcvbn/ipapatch \
            --pattern "$ASSET" \
            --dir .
          mkdir -p bin
          mv "$ASSET" bin/ipapatch
          chmod +x bin/ipapatch
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Patch Mx Swiftgram for sideloading
        shell: bash
        run: |
          set -euo pipefail
          IPA=/Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          PATCH_INPUT="$RUNNER_TEMP/Swiftgram-unpatched.ipa"
          PATCHED_IPA="$RUNNER_TEMP/Swiftgram-sideload.ipa"

          cp "$RUNNER_TEMP/Swiftgram-mx.ipa" "$PATCH_INPUT"
          chmod u+w "$PATCH_INPUT"

          ipapatch \
            --input "$PATCH_INPUT" \
            --output "$PATCHED_IPA" \
            --noconfirm

          test -f "$PATCHED_IPA"
          cp -f "$PATCHED_IPA" "$IPA"

          rm -rf verify-sideload
          mkdir verify-sideload
          unzip -q "$IPA" -d verify-sideload

          APP="$(find verify-sideload/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"

          # ipapatch stores one runtime in the host Frameworks directory.
          # Verify each binary loads it and its LC_RPATH resolves to that file.
          python3 - "$APP" <<'PY'
          import pathlib
          import plistlib
          import subprocess
          import sys

          app = pathlib.Path(sys.argv[1]).resolve()
          runtime = app / "Frameworks/zxPluginsInject.dylib"
          if not runtime.is_file():
              raise SystemExit(f"Missing sideload runtime: {runtime}")

          required_extensions = [
              "NotificationServiceExtensionv1.appex",
              "BroadcastUploadExtension.appex",
              "NotificationContentExtension.appex",
              "WidgetExtension.appex",
              "IntentsExtension.appex",
              "ShareExtension.appex",
          ]
          bundles = [app] + [app / "PlugIns" / name for name in required_extensions]
          for bundle in bundles:
              if not bundle.is_dir():
                  raise SystemExit(f"Missing bundle: {bundle}")
              with (bundle / "Info.plist").open("rb") as stream:
                  executable = bundle / plistlib.load(stream)["CFBundleExecutable"]
              dependencies = subprocess.check_output(
                  ["otool", "-L", str(executable)], text=True
              )
              dependency = "@rpath/zxPluginsInject.dylib"
              if not any(line.strip().startswith(dependency + " ")
                         for line in dependencies.splitlines()):
                  raise SystemExit(f"Missing runtime load command: {executable}")
              commands = subprocess.check_output(
                  ["otool", "-l", str(executable)], text=True
              )
              rpaths = []
              in_rpath = False
              for line in commands.splitlines():
                  line = line.strip()
                  if line.startswith("cmd "):
                      in_rpath = line == "cmd LC_RPATH"
                  elif in_rpath and line.startswith("path "):
                      rpaths.append(line[5:].rsplit(" (offset ", 1)[0])
                      in_rpath = False
              candidates = []
              for rpath in rpaths:
                  expanded = rpath.replace("@executable_path", str(executable.parent))
                  expanded = expanded.replace("@loader_path", str(executable.parent))
                  candidates.append((pathlib.Path(expanded) / runtime.name).resolve())
              if runtime not in candidates:
                  raise SystemExit(
                      f"Runtime not reachable from {executable}; LC_RPATH={rpaths}"
                  )
              print(f"OK runtime load and resolution: {bundle.name}", flush=True)
          PY

      - name: Verify Mx and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find verify-sideload/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          python3 build-system/gold-next/verify_mx.py "$APP"
          cd /Users/Shared/telegram-ios/build/artifacts
          shasum -a 256 Swiftgram.ipa > SHA256.txt

      - name: Save verified Mx
        if: steps.mx_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mx-output
          key: ${{ steps.mx_cache.outputs.cache-primary-key }}

      - name: Validate symbols against the patched IPA
        shell: bash
        run: |
          set -euo pipefail
          apps=(verify-sideload/Payload/*.app)
          python3 build-system/gold-next/collect_dsyms.py "${apps[0]}" \
            /Users/Shared/telegram-ios/bazel-out "$RUNNER_TEMP/Swiftgram-dSYMs.zip"

      - name: Upload UUID-verified debugging symbols
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-dSYMs-${{ github.sha }}
          path: ${{ runner.temp }}/Swiftgram-dSYMs.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Mx IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-13.2-gold-next-Mx-1.0.0
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
            /Users/Shared/telegram-ios/build/artifacts/SHA256.txt
          if-no-files-found: error
