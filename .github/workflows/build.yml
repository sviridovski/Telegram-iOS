name: CI

on:
  push:
    branches: [ swiftgram-11.3.3-149-mx-experimental ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Configure and verify simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 -u <<'PY'
          import json
          import subprocess

          def read_json(*args):
              return json.loads(subprocess.check_output(args, text=True))

          sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-version"], text=True
          ).strip()
          sdk_key = "iphoneos" + sdk_version
          matches = read_json("xcrun", "simctl", "runtime", "match", "list", "-j")
          runtimes = read_json("xcrun", "simctl", "runtime", "list", "-j")
          print("Installed runtime images:", json.dumps(runtimes, indent=2))
          sdk_build = matches.get(sdk_key, {}).get("sdkBuild")
          if not sdk_build:
              raise SystemExit("Missing SDK build for " + sdk_key + ": " + json.dumps(matches))

          # runtime list uses platformIdentifier, not platform="iOS".
          # Use the oldest usable runtime from the SDK's major iOS version.
          candidates = [
              runtime for runtime in runtimes.values()
              if runtime.get("platformIdentifier") == "com.apple.platform.iphonesimulator"
              and str(runtime.get("version", "")).split(".")[0] == sdk_version.split(".")[0]
              and runtime.get("build")
              and runtime.get("state") != "Unusable"
          ]
          if not candidates:
              raise SystemExit("No usable iOS " + sdk_version.split(".")[0] + " runtime installed")
          candidates.sort(key=lambda runtime: tuple(int(n) for n in runtime["version"].split(".")))
          runtime = candidates[0]
          print("Mapping", sdk_key, sdk_build, "to iOS", runtime["version"], runtime["build"], flush=True)
          subprocess.check_call([
              "xcrun", "simctl", "runtime", "match", "set",
              sdk_key, runtime["build"], "--sdkBuild", sdk_build,
          ])
          subprocess.check_call(["xcrun", "simctl", "runtime", "match", "list"])
          PY

          # Exercise the exact asset catalog that failed in CI #3 before Bazel.
          ASSET_CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$ASSET_CHECK_DIR"' EXIT
          xcrun actool --compile "$ASSET_CHECK_DIR" \
            --platform iphoneos --minimum-deployment-target 12.0 \
            --compress-pngs --target-device iphone --target-device ipad \
            --output-partial-info-plist "$ASSET_CHECK_DIR/partial.plist" \
            Telegram/WidgetKitWidget/WidgetImages.xcassets

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          # This CI produces an unsigned IPA for later re-signing. Bundled
          # fake profiles provide entitlement metadata only, not installation rights.
          python3 -u <<'PY'
          import pathlib
          import plistlib
          import subprocess

          profile_dir = pathlib.Path("build-system/fake-codesigning/profiles")
          fixture_ids = []
          for path in sorted(profile_dir.glob("*.mobileprovision")):
              profile = plistlib.loads(subprocess.check_output(
                  ["security", "cms", "-D", "-i", str(path)]
              ))
              fixture_ids.append(profile["UUID"])
              print("CI fixture:", path.name, "expires:", profile["ExpirationDate"])
          if not fixture_ids:
              raise SystemExit("No bundled fake provisioning profiles found")

          # Expiration is checked even with entitlements_validation='skip'.
          # Exempt only UUIDs decoded from this checkout's fake profiles.
          # All entitlement checks and all other profile expiry checks remain.
          tool = pathlib.Path("build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py")
          original = "    if expire and expire < datetime.datetime.now():"
          replacement = (
              "    is_ci_fixture = self._profile_metadata.get('UUID') in " + repr(tuple(fixture_ids)) + "\n"
              "    if expire and expire < datetime.datetime.now() and is_ci_fixture:\n"
              "      print('WARNING: expired CI fixture; output requires re-signing')\n"
              "    if expire and expire < datetime.datetime.now() and not is_ci_fixture:"
          )
          source = tool.read_text()
          if source.count(original) != 1:
              raise SystemExit("Unexpected plisttool source; refusing to patch")
          tool.write_text(source.replace(original, replacement))
          with pathlib.Path(".bazelrc").open("a") as config:
              config.write("\n# CI unsigned archive for re-signing\nbuild --features=disable_legacy_signing\n")
          PY
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Swiftgram-11.3.3-149-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Use IPA from this build for Mx
        run: |
          set -euo pipefail
          mkdir -p clean
          cp /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa clean/Telegram.ipa

      - name: Fetch MxGram source
        uses: actions/checkout@v4
        with:
          repository: m1ronx1412/mxgram
          ref: 23c980300c3e9c98f39ee2bd073fe83d317e15ba
          path: mxgram

      - name: Set up Theos for Mx
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Build Mx 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          cd mxgram
          make clean package FINALPACKAGE=1 STRIP=0 ARCHS=arm64
          packages=(packages/com.m1ronx.mx_*_iphoneos-arm.deb)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" ../com.m1ronx.mx_1.0.0_iphoneos-arm.deb
          test -d Mx.bundle
          test -f packages/Mx.dylib

      - name: Install Cyan injector
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          cyan --help >/dev/null

      - name: Inject Mx
        run: |
          set -euo pipefail
          mkdir -p output
          cyan \
            -i clean/Telegram.ipa \
            -o output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa \
            -uwsgqf \
            com.m1ronx.mx_1.0.0_iphoneos-arm.deb \
            mxgram/Mx.bundle
          test -f output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa

      - name: Make Mx build install as Swiftgram alongside Telegram
        run: |
          set -euo pipefail
          python3 build-system/personal-tgextra/retarget_ipa.py \
            output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa \
            ph.telegra.Telegraph app.swiftgram.ios

      - name: Install ipapatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/asdfzxcvbn/ipapatch/releases/latest --jq .tag_name)
          ARCH=$(uname -m)
          if [[ "$ARCH" == "arm64" ]]; then
            ASSET="ipapatch.macos-arm64"
          else
            ASSET="ipapatch.macos-amd64"
          fi
          gh release download "$TAG" \
            --repo asdfzxcvbn/ipapatch \
            --pattern "$ASSET" \
            --dir .
          mkdir -p bin
          mv "$ASSET" bin/ipapatch
          chmod +x bin/ipapatch
          echo "PATH=$GITHUB_WORKSPACE/bin:$PATH" >> "$GITHUB_ENV"

      - name: Patch Mx IPA for sideloading
        run: |
          set -euo pipefail
          ipapatch \
            --input output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa \
            --inplace \
            --noconfirm

      - name: Verify Mx and PlugIns survived
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir verify
          unzip -q output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa -d verify

          APP=$(find verify/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "app.swiftgram.ios"

          required_extensions=(
            "NotificationServiceExtensionv1.appex"
            "BroadcastUploadExtension.appex"
            "NotificationContentExtension.appex"
            "WidgetExtension.appex"
            "IntentsExtension.appex"
            "ShareExtension.appex"
          )

          for ext in "${required_extensions[@]}"; do
            test -d "$APP/PlugIns/$ext"
            ext_id="$(plutil -extract CFBundleIdentifier raw -o - "$APP/PlugIns/$ext/Info.plist")"
            [[ "$ext_id" == app.swiftgram.ios.* ]]
            echo "OK PlugIn: $ext ($ext_id)"
          done

          BUNDLE_PATH=$(find "$APP" -type d -name 'Mx.bundle' | head -n 1)
          test -n "$BUNDLE_PATH"
          echo "OK Mx bundle: $BUNDLE_PATH"

          DYLIB_PATH=$(find "$APP" -type f -name 'Mx.dylib' | head -n 1)
          test -n "$DYLIB_PATH"
          echo "OK Mx dylib: $DYLIB_PATH"

      - name: Generate checksum
        run: |
          shasum -a 256 \
            output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa \
            | tee output/SHA256.txt

      - name: Upload Mx IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-11.3.3-149-Mx-1.0.0-Experimental
          path: |
            output/Swiftgram-11.3.3-149-Mx-1.0.0.ipa
            output/SHA256.txt
          if-no-files-found: error
