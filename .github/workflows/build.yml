name: CI

on:
  # push:
  #   branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Configure and verify simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 -u <<'PY'
          import json
          import subprocess

          def read_json(*args):
              return json.loads(subprocess.check_output(args, text=True))

          sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-version"], text=True
          ).strip()
          sdk_key = "iphoneos" + sdk_version
          matches = read_json("xcrun", "simctl", "runtime", "match", "list", "-j")
          runtimes = read_json("xcrun", "simctl", "runtime", "list", "-j")
          print("Installed runtime images:", json.dumps(runtimes, indent=2))
          sdk_build = matches.get(sdk_key, {}).get("sdkBuild")
          if not sdk_build:
              raise SystemExit("Missing SDK build for " + sdk_key + ": " + json.dumps(matches))

          # runtime list uses platformIdentifier, not platform="iOS".
          # Use the oldest usable runtime from the SDK's major iOS version.
          candidates = [
              runtime for runtime in runtimes.values()
              if runtime.get("platformIdentifier") == "com.apple.platform.iphonesimulator"
              and str(runtime.get("version", "")).split(".")[0] == sdk_version.split(".")[0]
              and runtime.get("build")
              and runtime.get("state") != "Unusable"
          ]
          if not candidates:
              raise SystemExit("No usable iOS " + sdk_version.split(".")[0] + " runtime installed")
          candidates.sort(key=lambda runtime: tuple(int(n) for n in runtime["version"].split(".")))
          runtime = candidates[0]
          print("Mapping", sdk_key, sdk_build, "to iOS", runtime["version"], runtime["build"], flush=True)
          subprocess.check_call([
              "xcrun", "simctl", "runtime", "match", "set",
              sdk_key, runtime["build"], "--sdkBuild", sdk_build,
          ])
          subprocess.check_call(["xcrun", "simctl", "runtime", "match", "list"])
          PY

          # Exercise the exact asset catalog that failed in CI #3 before Bazel.
          ASSET_CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$ASSET_CHECK_DIR"' EXIT
          xcrun actool --compile "$ASSET_CHECK_DIR" \
            --platform iphoneos --minimum-deployment-target 12.0 \
            --compress-pngs --target-device iphone --target-device ipad \
            --output-partial-info-plist "$ASSET_CHECK_DIR/partial.plist" \
            Telegram/WidgetKitWidget/WidgetImages.xcassets

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Swiftgram-11.3.3-149-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

